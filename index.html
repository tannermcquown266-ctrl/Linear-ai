<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear AI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      height:100vh;
      display:flex;
      overflow:hidden;
    }

    .sidebar{
      width:260px;
      background:rgba(15,15,15,.85);
      border-right:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(20px);
      padding:20px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8a5cff;
      margin-bottom:30px;
    }

    .button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#8a5cff,#00d4ff);
      color:white;
      font-size:16px;
      margin-bottom:12px;
    }

    .main{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .welcome{
      text-align:center;
      z-index:2;
    }

    .welcome h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .welcome p{
      color:#bbbbbb;
      font-size:18px;
    }
#messages{
    width:100%;
    max-width:700px;
    margin-bottom:20px;
    display:flex;
    flex-direction:column;
    gap:12px;
}

.bot-message{
    background:#2b2b2b;
    padding:12px 16px;
    border-radius:14px;
    align-self:flex-start;
}

.user-message{
    background:#8a5cff;
    padding:12px 16px;
    border-radius:14px;
    align-self:flex-end;
}

.chat-bar{
    display:flex;
    gap:10px;
    width:100%;
    max-width:700px;
}

.chat-bar input{
    flex:1;
    padding:14px;
    border-radius:12px;
    border:none;
    font-size:16px;
}

.chat-bar button{
    padding:14px 20px;
    border:none;
    border-radius:12px;
    background:#8a5cff;
    color:white;
    cursor:pointer;
}
    .aurora{
      position:absolute;
      width:700px;
      height:700px;
      border-radius:50%;
      background:radial-gradient(circle,
      rgba(138,92,255,.45),
      rgba(0,212,255,.25),
      transparent 70%);
      filter:blur(80px);
      animation:float 10s ease-in-out infinite alternate;
    }
@keyframes float{
    from{
        transform:translate(-120px,-60px);
    }

    to{
        transform:translate(120px,60px);
     
    
}
}
</style>
</head>

<body>
    




<div class="sidebar">
  <div class="logo">Linear AI</div>

  <button class="button" onclick="newChat()">+ New Chat</button>

  <p>💬 Chats</p><br>
  <p>🖼 Image Studio</p><br>
  <p>🎥 Video Studio</p><br>
  <p>📁 Files</p><br>
  <p>⚙️ Settings</p>
</div>

<div class="main">
  <div class="aurora"></div>

  <div class="welcome">

    <div id="messages">
        <div class="bot-message">   Hello! I'm Linear AI.
        </div>
    </div>
<div class="chat-bar">

    <input
        id="userInput"
        type="text"
        placeholder="Type a message..."
    >

    <button onclick="sendMessage()">
        Send
    </button>

</div>

</div>

<script>
function newChat() {
    const messages = document.getElementById("messages");
    const input = document.getElementById("userInput");

    messages.innerHTML = `
        <div class="bot-message">
            Hello! I'm Linear AI.
        </div>
    `;

    input.value = "";
    input.focus();
}

function sendMessage() {
    const input = document.getElementById("userInput");
    const messages = document.getElementById("messages");

    if (input.value.trim() === "") return;

    messages.innerHTML += `
        <div class="user-message">
            ${input.value}
        </div>
        <div class="bot-message">
            I'm still under construction 🤖
        </div>
    `;

    input.value = "";
    messages.scrollTop = messages.scrollHeight;
}

document.getElementById("userInput").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});


</script>
   
</body>
</html>
