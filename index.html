<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linear AI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#050505;
      color:white;
      height:100vh;
      display:flex;
      overflow:hidden;
    }

    .sidebar{
      width:260px;
      background:rgba(15,15,15,.85);
      border-right:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(20px);
      padding:20px;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      color:#8a5cff;
      margin-bottom:30px;
    }

    .button{
      width:100%;
      padding:14px;
      border:none;
      border-radius:14px;
      background:linear-gradient(90deg,#8a5cff,#00d4ff);
      color:white;
      font-size:16px;
      margin-bottom:12px;
    }

    .main{
      flex:1;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
    }

    .welcome{
      text-align:center;
      z-index:2;
    }

    .welcome h1{
      font-size:48px;
      margin-bottom:10px;
    }

    .welcome p{
      color:#bbbbbb;
      font-size:18px;
    }

    .aurora{
      position:absolute;
      width:700px;
      height:700px;
      border-radius:50%;
      background:radial-gradient(circle,
      rgba(138,92,255,.45),
      rgba(0,212,255,.25),
      transparent 70%);
      filter:blur(80px);
      animation:float 10s ease-in-out infinite alternate;
    }
@keyframes float{
    from{
        transform:translate(-120px,-60px);
    }

    to{
        transform:translate(120px,60px);
    }
}
</style>
</head>

<body>
    




<div class="sidebar">
  <div class="logo">Linear AI</div>

  <button class="button" onclick="newChat()">+ New Chat</button>

  <p>💬 Chats</p><br>
  <p>🖼 Image Studio</p><br>
  <p>🎥 Video Studio</p><br>
  <p>📁 Files</p><br>
  <p>⚙️ Settings</p>
</div>

<div class="main">
  <div class="aurora"></div>

  <div class="welcome">
    <h1>Welcome to Linear AI</h1>
    <p>Your private AI assistant.</p>
  </div>
</div>

</body>
</html>
